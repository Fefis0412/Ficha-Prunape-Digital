<style>
:root{
  --linea:#4a4a4a; --verde:#a8c0a4;
  --ok:#1a7f37; --no:#c62828;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9ecef;color:#111;
  font-family:Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- barra de herramientas ---------- */
#tools{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:8px 14px;background:#fff;border-bottom:1px solid #c8ccd0;box-shadow:0 1px 4px rgba(0,0,0,.08);
  font-size:13px}
#tools button{font:inherit;padding:6px 12px;border:1px solid #b9bec4;background:#f7f8f9;border-radius:6px;cursor:pointer}
#tools button:hover{background:#eceef0}
#tools .sep{width:1px;height:22px;background:#d5d9dd}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:#f1f3f5}
.pill i{width:11px;height:11px;border-radius:3px;display:inline-block}
.pill i.ok{background:var(--ok)} .pill i.no{background:var(--no)}
#veredicto{font-weight:bold}

/* ---------- lienzo ---------- */
#wrap{overflow:hidden;margin:32px auto 48px;background:#fff;
  box-shadow:0 2px 18px rgba(0,0,0,.16)}
#sheet{position:relative;width:3454px;height:4925px;background:#fff;transform-origin:top left}
#page{left:0;top:0;width:3454px;height:4925px}   /* capa de contenido, se centra sola */
#sheet *{position:absolute}

.tt{white-space:pre;line-height:1}
.b{font-weight:bold}

/* campos */
.fld{border:0;background:transparent;font:inherit;color:#00307a;
  font-size:44px;padding:0 8px;outline:none;font-family:Arial,Helvetica,sans-serif}
.fld:focus{background:#fff6cc}
.dash{height:5px;background-image:repeating-linear-gradient(to right,#111 0 20px,transparent 20px 38px)}
.auto{color:#8a2f00;font-weight:bold}

/* ejes */
.tick{background:#111;width:3px}
.axnum{font-size:44px;text-align:center}

/* ítems */
.bar{border:2px solid var(--linea);background:#fff;cursor:pointer;height:60px}
.bar .fill{top:0;bottom:0;right:0;background:var(--verde)}
.bar .div{top:0;bottom:0;width:2px;background:var(--linea)}
.lbl{font-size:30px;line-height:30px;white-space:nowrap;transform-origin:left center;
  transform:translateY(-50%) scaleX(.82);top:50%;letter-spacing:.2px}
.note{font-size:29px;top:50%;transform:translateY(-50%) scaleX(.85);transform-origin:left center;white-space:nowrap}
.tail{font-size:30px;top:50%;transform:translate(-50%,-50%) scaleX(.85);white-space:nowrap}
.bar.ok{border-color:var(--ok);box-shadow:inset 0 0 0 3px rgba(26,127,55,.35)}
.bar.no{border-color:var(--no);box-shadow:inset 0 0 0 3px rgba(198,40,40,.30)}
.mark{font-size:52px;font-weight:bold;top:50%;transform:translateY(-50%);right:10px;pointer-events:none}
.bar.ok .mark{color:var(--ok)} .bar.no .mark{color:var(--no)}

/* rótulos de área */
.area{font-size:46px;letter-spacing:6px;transform-origin:center center;
  transform:rotate(-90deg);text-align:center;white-space:nowrap}

/* línea de edad */
#edad{top:940px;height:3679px;width:0;border-left:5px dashed #d0021b;z-index:5;pointer-events:none;display:none}
#edadlab{color:#d0021b;font-size:38px;font-weight:bold;top:952px;z-index:6;background:#fff;padding:2px 6px;display:none}

@media print{
  html,body{background:#fff}
  #tools{display:none}
  #wrap{margin:0 auto;box-shadow:none}
  @page{size:A4 portrait;margin:6mm}
}
</style>

  if(css)Object.assign(e.style,css);if(html!=null)e.innerHTML=html;return e;}
function px(n){return n+'px'}
function xOf(m){
  if(m<=0)return BP[0][1];
  for(let i=1;i<BP.length;i++){const a=BP[i-1][0],xa=BP[i-1][1],b=BP[i][0],xb=BP[i][1];
    if(m<=b)return xa+(xb-xa)*(m-a)/(b-a);}
  return BP[BP.length-1][1];
}

/* ================= ítems ================= */
const state={};
const SX=0.82, SN=0.85;   // factores de condensado de .lbl y .note
const AFIX={31:2557,48:1936,49:1678,53:1180,55:2640,57:2445,61:2210};
ITEMS.forEach(function(it){
  let a=(AFIX[it.i]!=null?AFIX[it.i]:it.a);
  // si la nota "(NN)" quedó dentro del rectángulo detectado, se corre el borde izquierdo
  const noteIn = it.nl && it.tx==null && (it.t-a)<24;
  if(noteIn) a=Math.min(a+72,it.b-60);
  const w=it.b-a;
  const bar=el('div','bar',{left:px(a),top:px(it.y),width:px(w)});
  bar.dataset.i=it.i;
  if(it.g!=null)bar.appendChild(el('div','fill',{left:px(Math.max(0,it.g-a))}));

  const lab=el('div','lbl',{left:'0px'});
  lab.innerHTML=it.txt.map(function(t){return '<div style="position:static">'+t+'</div>';}).join('');
  bar.appendChild(lab);
  sheet.appendChild(bar);
  const lw=lab.offsetWidth*SX;

  // inicio de la etiqueta: divisoria interna sólo si el texto sigue entrando en la barra
  let lx=a+9;
  if(it.tx!=null) lx=it.tx;
  else if(it.d && it.d>a+30 && it.d+9+lw<=it.b-8){ lx=it.d+9;
    bar.appendChild(el('div','div',{left:px(it.d-a)})); }
  lab.style.left=px(lx-a);

  const labEnd=lx+lw;
  if(it.nl){const n=el('div','note',{},it.nl);bar.appendChild(n);
    n.style.left=px(-(n.offsetWidth*SN+14));}
  let right=Math.max(it.b,labEnd);
  if(it.tail){const gx=(it.g!=null?it.g:a);
    const t=el('div','tail',{},it.tail);bar.appendChild(t);
    const tw=t.offsetWidth*SN;
    const tx=Math.max((gx+it.b)/2, labEnd+20+tw/2);
    t.style.left=px(tx-a);
    right=Math.max(right,tx+tw/2);}
  if(it.nr){const n=el('div','note',{},it.nr);bar.appendChild(n);
    n.style.left=px(right+16-a);}
  bar.appendChild(el('div','mark',null,''));
  bar.addEventListener('click',function(){
    const s=((state[it.i]||0)+1)%3; state[it.i]=s; paint(bar,s); save(); tally();
  });

});
function paint(bar,s){
  bar.classList.toggle('ok',s===1); bar.classList.toggle('no',s===2);
  bar.querySelector('.mark').textContent = s===1?'✓':(s===2?'✗':'');
}

/* ================= lógica ================= */
function val(id){return document.getElementById(id).value.trim()}
function num(id){const v=parseInt(val(id),10);return isNaN(v)?null:v}
function dateOf(p){const d=num(p+'_d'),m=num(p+'_m'),a=num(p+'_a');
  if(d==null||m==null||a==null)return null;
  const y=a<100?(a>30?1900+a:2000+a):a;
  const dt=new Date(y,m-1,d); return isNaN(dt.getTime())?null:dt;}
function ymd(days){const a=Math.floor(days/365.25);let r=days-a*365.25;
  const m=Math.floor(r/30.4375); const d=Math.round(r-m*30.4375);
  return [a,m,d];}
function calc(){
  const nac=dateOf('n'), pes=dateOf('p');
  const set=function(id,v){document.getElementById(id).value=(v==null?'':v);};
  if(!nac||!pes||pes<nac){['e_a','e_m','e_d','c_a','c_m','c_d'].forEach(function(i){set(i,'');});
    eLine.style.display='none';eLab.style.display='none';return;}
  const days=Math.round((pes-nac)/86400000);
  const t1=ymd(days); set('e_a',t1[0]);set('e_m',t1[1]);set('e_d',t1[2]);
  const eg=parseFloat(val('f_eg'));
  let cdays=days;
  if(!isNaN(eg)&&eg>0&&eg<37) cdays=Math.max(0,days-Math.round((40-eg)*7));
  const t2=ymd(cdays); set('c_a',t2[0]);set('c_m',t2[1]);set('c_d',t2[2]);
  const meses=cdays/30.4375;
  const x=xOf(meses);
  eLine.style.left=px(x); eLine.style.display='block';
  eLab.style.left=px(Math.min(x+12,2900)); eLab.style.display='block';
  eLab.textContent='edad corregida: '+meses.toFixed(1)+' meses';
}
function tally(){
  let A=0,B=0,P=0;
  ITEMS.forEach(function(it){const s=state[it.i]||0; if(s===1)P++; else if(s===2){ it.star?A++:B++; }});
  document.getElementById('cA').textContent=A;
  document.getElementById('cB').textContent=B;
  document.getElementById('cP').textContent=P;
  const v=document.getElementById('veredicto');
  if(A===0&&B===0){v.textContent='—';v.style.color='#555';}
  else if(A>=1||B>=2){v.textContent='Criterio de fracaso alcanzado (revisar manual)';v.style.color='#c62828';}
  else {v.textContent='Sin criterio de fracaso';v.style.color='#1a7f37';}
}
const KEY='prunape-ficha-v1';
function save(){
  const h={}; document.querySelectorAll('input.fld').forEach(function(i){h[i.id]=i.value;});
  localStorage.setItem(KEY,JSON.stringify({h:h,state:state}));
}
function load(){
  try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');
    if(o.h)Object.keys(o.h).forEach(function(k){const n=document.getElementById(k);if(n)n.value=o.h[k];});
    if(o.state){Object.assign(state,o.state);
      document.querySelectorAll('.bar[data-i]').forEach(function(b){paint(b,state[b.dataset.i]||0);});}
  }catch(e){}
}
document.querySelectorAll('input.fld').forEach(function(i){i.addEventListener('input',function(){calc();save();});});
document.getElementById('bClear').addEventListener('click',function(){
  if(!confirm('¿Borrar todos los datos de la ficha?'))return;
  localStorage.removeItem(KEY);location.reload();
});
document.getElementById('bPrint').addEventListener('click',function(){window.print();});

function apply(s){
  sheetEl.style.transform='scale('+s+')';   // se escala la hoja, no la capa interna
  const wrap=document.getElementById('wrap');
  wrap.style.width=(SW*s)+'px'; wrap.style.height=(SH*s)+'px';
}
/* Mide el contenido real y le deja el mismo margen blanco a izquierda y derecha.
   Sin esto el último número del eje se salía de la hoja y quedaba recortado. */
function layout(){
  const b=sheet.getBoundingClientRect();
  let minX=Infinity,maxX=-Infinity;
  sheet.querySelectorAll('*').forEach(function(e){
    const r=e.getBoundingClientRect();
    if(!r.width&&!r.height)return;
    if(r.left-b.left<minX)minX=r.left-b.left;
    if(r.right-b.left>maxX)maxX=r.right-b.left;
  });
  if(!isFinite(minX))return;
  SW=Math.round(maxX-minX+MARGEN*2);
  sheet.style.left=px(Math.round(MARGEN-minX));
  sheetEl.style.width=px(SW);
}

const MAXW=1700;   // ancho máximo de la ficha en pantalla
function fit(){
  const vw=document.documentElement.clientWidth;
  const pad=Math.max(24,Math.min(96,vw*0.05));      // aire a los costados
  apply(Math.min(1,MAXW/SW,(vw-pad*2)/SW));
}
addEventListener('resize',fit);
addEventListener('beforeprint',function(){apply(Math.min(718/SW,1035/SH));});
addEventListener('afterprint',fit);
load();layout();fit();calc();tally();
